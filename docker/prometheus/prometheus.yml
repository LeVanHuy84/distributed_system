global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "flashorder-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8080" # order-service
          - "host.docker.internal:8081" # inventory-service
          - "host.docker.internal:8082" # payment-service
