server:
  port: 8082

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/flashorder_db
    username: flashorder
    password: flashorder_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PaymentServiceHikariPool

  flyway:
    enabled: false

flashorder:
  mock:
    payment:
      delay-ms: 0
