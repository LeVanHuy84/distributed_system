spring:
  application:
    name: flashorder
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/flashorder_db
    username: flashorder
    password: flashorder_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: FlashOrderHikariPool

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

flashorder:
  mock:
    payment:
      delay-ms: 0
