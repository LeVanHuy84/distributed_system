services:
  postgres:
    image: postgres:17-alpine
    container_name: flashorder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashorder_db
      POSTGRES_USER: flashorder
      POSTGRES_PASSWORD: flashorder_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashorder -d flashorder_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
