version: '3'

vars:
  GRADLE: '{{if eq OS "windows"}}cmd /c gradlew.bat{{else}}./gradlew{{end}}'
  COMPOSE_BENCH: docker compose -f docker-compose.bench.yml
  K6_DOCKER: >-
    docker run --rm --add-host=host.docker.internal:host-gateway
    -v "{{.TASKFILE_DIR}}/benchmarks:/benchmarks"
    grafana/k6

tasks:
  default:
    desc: "Liệt kê toàn bộ các lệnh khả dụng"
    cmds:
      - task --list

  dev:order:
    desc: "Khởi động Order Service (port 8080)"
    cmds:
      - "{{.GRADLE}} :services:order-service:bootRun"

  dev:inventory:
    desc: "Khởi động Inventory Service (port 8081)"
    cmds:
      - "{{.GRADLE}} :services:inventory-service:bootRun"

  dev:payment:
    desc: "Khởi động Payment Service (port 8082)"
    cmds:
      - "{{.GRADLE}} :services:payment-service:bootRun"

  build:
    desc: "Build dự án và kiểm tra cú pháp (bỏ qua tests)"
    cmds:
      - "{{.GRADLE}} build -x test"

  clean:
    desc: "Xóa sạch thư mục build"
    cmds:
      - "{{.GRADLE}} clean"

  format:
    desc: "Tự động chuẩn hóa định dạng mã nguồn (Spotless Apply)"
    cmds:
      - "{{.GRADLE}} spotlessApply"

  format:check:
    desc: "Kiểm tra định dạng mã nguồn (Spotless Check)"
    cmds:
      - "{{.GRADLE}} spotlessCheck"

  test:
    desc: "Chạy toàn bộ unit tests"
    cmds:
      - "{{.GRADLE}} test"

  test:concurrent:
    desc: "Chạy kiểm thử đa luồng tranh chấp kho (Testcontainers)"
    cmds:
      - '{{.GRADLE}} test --tests "*Concurrent*"'

  test:integration:
    desc: "Chạy toàn bộ integration tests"
    cmds:
      - '{{.GRADLE}} test --tests "*Integration*"'

  infra:up:
    desc: "Bật toàn bộ hạ tầng local dev (PostgreSQL, Redis, Kafka) và chờ healthy"
    cmds:
      - docker compose up -d --wait

  infra:down:
    desc: "Dừng toàn bộ hạ tầng local dev"
    cmds:
      - docker compose down

  infra:reset:
    desc: "Xóa sạch toàn bộ volumes và khởi động lại hạ tầng local dev trắng"
    cmds:
      - docker compose down -v
      - task: infra:up

  obs:up:
    desc: "Bật các container Observability"
    cmds:
      - docker compose --profile observability up -d

  obs:down:
    desc: "Tắt các container Observability (giữ nguyên DB/Redis/Kafka)"
    cmds:
      - docker compose stop prometheus grafana jaeger

  db:up:
    desc: "Bật container PostgreSQL phục vụ chạy local dev"
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: "Dừng toàn bộ containers"
    cmds:
      - docker compose down

  db:reset:
    desc: "Xóa sạch dữ liệu và khởi động lại PostgreSQL trắng"
    cmds:
      - docker compose down -v
      - task: db:up

  db:psql:
    desc: "Truy cập PostgreSQL CLI (mặc định flashorder/flashorder_db; hỗ trợ USER=... DB=...)"
    vars:
      DB_USER: '{{.USER | default "flashorder"}}'
      DB_NAME: '{{.DB | default "flashorder_db"}}'
    cmds:
      - docker compose exec -it postgres psql -U {{.DB_USER}} -d {{.DB_NAME}}

  bench:infra:up:
    desc: "[Bench] Bật toàn bộ hạ tầng benchmark (PostgreSQL, Redis, Kafka) và chờ healthy"
    cmds:
      - "{{.COMPOSE_BENCH}} up -d --wait"

  bench:infra:down:
    desc: "[Bench] Dừng toàn bộ hạ tầng benchmark"
    cmds:
      - "{{.COMPOSE_BENCH}} down"

  bench:infra:reset:
    desc: "[Bench] Xóa sạch volumes benchmark và khởi động lại hạ tầng trắng"
    cmds:
      - "{{.COMPOSE_BENCH}} down -v"
      - task: bench:infra:up

  bench:db:up:
    desc: "[Bench] Bật container PostgreSQL riêng cho benchmark (port 5433) và chờ sẵn sàng"
    cmds:
      - "{{.COMPOSE_BENCH}} up -d --wait postgres-bench"

  bench:db:down:
    desc: "[Bench] Dừng toàn bộ containers benchmark"
    cmds:
      - "{{.COMPOSE_BENCH}} down"

  bench:db:reset:
    desc: "[Bench] Xóa sạch volume benchmark và khởi động lại PostgreSQL trắng"
    cmds:
      - "{{.COMPOSE_BENCH}} down -v"
      - task: bench:db:up

  bench:db:psql:
    desc: "[Bench] Truy cập PostgreSQL CLI của DB benchmark (hỗ trợ USER=... DB=...)"
    vars:
      DB_USER: '{{.USER | default "flashorder"}}'
      DB_NAME: '{{.DB | default "flashorder_bench"}}'
    cmds:
      - "{{.COMPOSE_BENCH}} exec -it postgres-bench psql -U {{.DB_USER}} -d {{.DB_NAME}}"

  bench:app:
    desc: "[Bench] Khởi động Spring Boot với profile benchmark (VIRTUAL_THREADS=true|false)"
    env:
      SPRING_PROFILES_ACTIVE: benchmark
      SPRING_THREADS_VIRTUAL_ENABLED: '{{.VIRTUAL_THREADS | default "true"}}'
    cmds:
      - "{{.GRADLE}} :services:order-service:bootRun"

  bench:db:seed:
    desc: "[Bench] Reset sạch orders/reservations và seed dữ liệu SKU benchmark"
    preconditions:
      - sh: >-
          {{.COMPOSE_BENCH}} exec -T postgres-bench
          psql -U flashorder -d flashorder_bench -c "SELECT 1 FROM inventory_items LIMIT 1;" > /dev/null 2>&1
        msg: "Bảng inventory_items chưa tồn tại! Hãy chạy 'task bench:app' ít nhất 1 lần để Flyway tạo schema."
    cmds:
      - "{{.COMPOSE_BENCH}} exec -T postgres-bench psql -U flashorder -d flashorder_bench < benchmarks/db/seed-benchmark.sql"

  bench:warmup:
    desc: "[Bench] Warm-up JVM & HikariCP trong 10s"
    cmds:
      - '{{.K6_DOCKER}} run -e STRATEGY={{.STRATEGY | default "ATOMIC_UPDATE"}} -e THREADS_MODE={{.THREADS_MODE | default "virtual"}} /benchmarks/k6/warmup.js'

  bench:run:
    desc: "[Bench] Pipeline chuẩn: Seed -> Warmup -> k6 Scenario"
    vars:
      STRATEGY: '{{.STRATEGY | default "ATOMIC_UPDATE"}}'
      THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}'
      SKIP_WARMUP: '{{.SKIP_WARMUP | default "false"}}'
    preconditions:
      - sh: 'test -n "{{.SCENARIO}}"'
        msg: "Thiếu biến SCENARIO (ví dụ: task bench:run SCENARIO=01-baseline)"
      - sh: "curl -sf http://localhost:8080/actuator/prometheus > /dev/null"
        msg: "App profile 'benchmark' chưa sẵn sàng! Hãy chạy 'task bench:app' ở terminal khác (không dùng 'task dev')."
    cmds:
      - task: bench:db:seed
      - '{{if ne .SKIP_WARMUP "true"}}{{.K6_DOCKER}} run -e STRATEGY={{.STRATEGY}} -e THREADS_MODE={{.THREADS_MODE}} /benchmarks/k6/warmup.js{{else}}echo "Skipping warm-up (SKIP_WARMUP=true)"{{end}}'
      - "{{.K6_DOCKER}} run -e STRATEGY={{.STRATEGY}} -e THREADS_MODE={{.THREADS_MODE}} /benchmarks/k6/scenarios/{{.SCENARIO}}.js"

  bench:baseline:
    desc: "[Bench] 01 - Baseline (100 VUs, 10.000 SKU, 60s)"
    cmds:
      - task: bench:run
        vars: { SCENARIO: "01-baseline", STRATEGY: '{{.STRATEGY | default "ATOMIC_UPDATE"}}', THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}' }

  bench:hotspot-low:
    desc: "[Bench] 02 - Hotspot Low (100 VUs, 100 SKU, 30s)"
    cmds:
      - task: bench:run
        vars: { SCENARIO: "02-hotspot-low", STRATEGY: '{{.STRATEGY | default "ATOMIC_UPDATE"}}', THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}' }

  bench:hotspot-medium:
    desc: "[Bench] 03 - Hotspot Medium (500 VUs, 100 SKU, 30s)"
    cmds:
      - task: bench:run
        vars: { SCENARIO: "03-hotspot-medium", STRATEGY: '{{.STRATEGY | default "ATOMIC_UPDATE"}}', THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}' }

  bench:hotspot-high:
    desc: "[Bench] 04 - Hotspot High (1.000 VUs, 100 SKU, 30s)"
    cmds:
      - task: bench:run
        vars: { SCENARIO: "04-hotspot-high", STRATEGY: '{{.STRATEGY | default "ATOMIC_UPDATE"}}', THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}' }

  bench:extreme:
    desc: "[Bench] 05 - Extreme Contention (1.000 VUs, 1 SKU, 10s)"
    cmds:
      - task: bench:run
        vars: { SCENARIO: "05-extreme-contention", STRATEGY: '{{.STRATEGY | default "ATOMIC_UPDATE"}}', THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}' }

  bench:sustained:
    desc: "[Bench] 06 - Sustained Load (200 VUs, 100 SKU, 5m)"
    cmds:
      - task: bench:run
        vars: { SCENARIO: "06-sustained-load", STRATEGY: '{{.STRATEGY | default "ATOMIC_UPDATE"}}', THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}' }

  bench:matrix:
    desc: "[Bench] Chạy cả 3 strategies cho một SCENARIO (vd: task bench:matrix SCENARIO=05-extreme-contention)"
    vars:
      THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}'
      SKIP_WARMUP: '{{.SKIP_WARMUP | default "false"}}'
    preconditions:
      - sh: 'test -n "{{.SCENARIO}}"'
        msg: "Thiếu biến SCENARIO (ví dụ: task bench:matrix SCENARIO=05-extreme-contention)"
      - sh: "curl -sf http://localhost:8080/actuator/prometheus > /dev/null"
        msg: "App profile 'benchmark' chưa sẵn sàng! Hãy chạy 'task bench:app' ở terminal khác (không dùng 'task dev')."
    cmds:
      - for: [OPTIMISTIC, PESSIMISTIC, ATOMIC_UPDATE]
        task: bench:run
        ignore_error: true
        vars:
          SCENARIO: "{{.SCENARIO}}"
          STRATEGY: "{{.ITEM}}"
          THREADS_MODE: "{{.THREADS_MODE}}"
          SKIP_WARMUP: "{{.SKIP_WARMUP}}"

  bench:suite:
    desc: "[Bench] Chạy trọn bộ 6 kịch bản (01..06) x 3 strategies và verify bất biến DB"
    vars:
      THREADS_MODE: '{{.THREADS_MODE | default "virtual"}}'
      SKIP_WARMUP: '{{.SKIP_WARMUP | default "false"}}'
    preconditions:
      - sh: "curl -sf http://localhost:8080/actuator/prometheus > /dev/null"
        msg: "App profile 'benchmark' chưa sẵn sàng! Hãy chạy 'task bench:app' ở terminal khác (không dùng 'task dev')."
    cmds:
      - for:
          - 01-baseline
          - 02-hotspot-low
          - 03-hotspot-medium
          - 04-hotspot-high
          - 06-sustained-load
          - 05-extreme-contention
        task: bench:matrix
        ignore_error: true
        vars:
          SCENARIO: "{{.ITEM}}"
          THREADS_MODE: "{{.THREADS_MODE}}"
          SKIP_WARMUP: "{{.SKIP_WARMUP}}"
      - task: bench:verify

  bench:verify:
    desc: "[Bench] Kiểm chứng bất biến Zero-Overselling trong DB benchmark"
    cmds:
      - >-
        {{.COMPOSE_BENCH}} exec -T postgres-bench psql -U flashorder -d flashorder_bench -c
        "SELECT COUNT(*) AS oversell_violations FROM inventory_items WHERE reserved_stock > total_stock OR reserved_stock < 0;"
      - >-
        {{.COMPOSE_BENCH}} exec -T postgres-bench psql -U flashorder -d flashorder_bench -c
        "SELECT sku_id, total_stock, reserved_stock, version FROM inventory_items WHERE sku_id = 'SKU-EXTREME-001';"
      - >-
        {{.COMPOSE_BENCH}} exec -T postgres-bench psql -U flashorder -d flashorder_bench -c
        "SELECT status, COUNT(*) FROM orders GROUP BY status ORDER BY status;"
